[package]
name = "bark-degen"
version = "0.1.0"
edition = "2024"
description = "Persistent Bark wallet and Barkdice player CLI"
license = "MIT"

[dependencies]
anyhow = "1"
ark-lib = "=0.7.1"
bark-wallet = { version = "=0.7.1", default-features = false, features = ["rand", "sqlite-bundled", "native", "tls-native-roots"] }
bip39 = { version = "2", features = ["rand"] }
bitcoin = "0.32.7"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
lightning-invoice = "0.34"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0
